name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: python -m pip install -e '.[dev]'
      - name: unit, board, cli, gate, verify, catalog, release
        run: python -m pytest -q
      - name: public-safety scan (generic patterns; the denylist is maintainer-local)
        run: python -m konstant.release scan --tree .
      - name: fresh-install end to end
        run: bash tests/e2e/fresh_install.sh
