# <!-- generated by konstant agents sync from catalog/; edit the source -->
# konstant's dsh layer: workspace-scoped reach for headless phases (docs/HARNESSES.md)
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.cwd()
- id: approval
  config:
    policy: never
- id: permission
  config:
    presets:
      workspace-write:
        sandbox: workspace-write
        approval: ask
      konstant:
        sandbox: workspace-write
        approval: never
    defaultPreset: konstant
- id: agent-instructions
  config:
    maxBytes: 65536
    projectRootMarkers: [konstant.toml]
- id: skill-filesystem
  config:
    includeDefaultRoots: false
    customSkillDirs: ["<WS>/.agents/skills"]
- id: llm-deepseek
  disabled: true
- id: llm-pi-ai
  config:
    providers:
      konstant:
        displayName: konstant endpoint
        apiKeyEnv: KONSTANT_ENDPOINT_KEY
        api: openai-completions
        baseURL: "http://127.0.0.1:8000/v1"
        models:
          - id: "local-model"
- id: agent-default-model
  config:
    provider: konstant
    model: !!js process.env.KONSTANT_MODEL || "local-model"
