name: ci

# Standard GitHub-hosted runners only; no secrets, no paid services, no deploy. The workflow file is
# export-ignored (not in the release tarball).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      GIT_AUTHOR_NAME: ci
      GIT_AUTHOR_EMAIL: ci@example.com
      GIT_COMMITTER_NAME: ci
      GIT_COMMITTER_EMAIL: ci@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: bubblewrap (konstant's jail)
        # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor; lift it for this
        # throwaway runner. Where the jail still cannot start, every jail-needing test is skipped
        # with the reason "bubblewrap cannot run here" and tests/e2e/factory.sh prints SKIPPED.
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --ro-bind / / --unshare-all true && echo "bubblewrap: a jail starts" \
            || echo "bubblewrap: no jail on this runner (jail tests are skipped)"
      - name: install
        run: python -m pip install -e '.[dev]'
      - name: pytest
        run: python -m pytest -q -rs
      - name: release build and scan (public patterns; the denylist is maintainer-local)
        run: |
          python -m konstant.release build --worktree --no-denylist --dist "$RUNNER_TEMP/dist"
          python -m konstant.release scan --tree .
      - name: fresh-install end to end
        run: bash tests/e2e/fresh_install.sh
      - name: one-line-install end to end
        run: bash tests/e2e/one_line.sh
      - name: the factory end to end (level 5, offline)
        run: bash tests/e2e/factory.sh
