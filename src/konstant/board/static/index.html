<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>konstant board</title>
  <link rel="stylesheet" href="/static/board.css">
</head>
<body>
  <header>
    <h1>konstant board</h1>
    <span id="whoami" class="muted"></span>
    <button id="forget" type="button" hidden>forget token</button>
  </header>
  <form id="login" hidden>
    <label for="token">Viewer token (<code>var/secrets/viewer.token</code>)</label>
    <input id="token" type="password" autocomplete="off" required>
    <button type="submit">Open</button>
    <p class="muted">Read-only view. The token stays in this browser only.</p>
  </form>
  <nav id="tabs" aria-label="views" hidden>
    <button type="button" id="tab-jobs" aria-pressed="true">Jobs</button>
    <button type="button" id="tab-memory" aria-pressed="false">Memory</button>
    <button type="button" id="tab-factory" aria-pressed="false">Factory</button>
  </nav>
  <main id="jobs-view">
    <section id="tree" aria-label="jobs"></section>
    <section id="detail" aria-live="polite"></section>
  </main>
  <main id="memory-view" hidden>
    <section aria-label="memory notes">
      <form id="mem-search" role="search">
        <label for="mem-q">Search memory</label>
        <input id="mem-q" type="search" autocomplete="off" placeholder="words to recall">
        <button type="submit">Recall</button>
      </form>
      <p id="mem-meta" class="muted"></p>
      <ul id="mem-list"></ul>
    </section>
    <section id="mem-detail" aria-live="polite"></section>
  </main>
  <main id="factory-view" hidden>
    <section aria-label="factory state">
      <p id="fac-state"></p>
      <h2>Goals</h2>
      <div id="fac-goals"></div>
      <h2>Escalations</h2>
      <ul id="fac-esc"></ul>
      <h2>Last events</h2>
      <ul id="fac-events"></ul>
    </section>
  </main>
  <p id="error" role="alert"></p>
  <script src="/static/board.js"></script>
</body>
</html>
